# https://railway.com/dashboard → serviço iae-blog-factory
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Memória: no painel do serviço, defina Memory limit = 512 MB
# (Settings → Resources / Memory). Isso corta o crescimento até 1 GB
# que estava dominando a fatura (~99% Memory).
