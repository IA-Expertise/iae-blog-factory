# https://railway.com/dashboard → serviço iae-blog-factory
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Scale sugerido (painel Settings → Scale):
#   Memory = 2 GB | CPU = 1 vCPU
# Variável opcional: HOST=0.0.0.0 (já default no scripts/start-server.mjs)
